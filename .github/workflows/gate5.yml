name: Gate 5 CPU DEV
on:
  push:
    branches: [dev/gate5-latent-fix-and-kv-patching]
permissions:
  contents: write
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest numpy
      - run: |
          set -euo pipefail
          mkdir -p results
          git config user.name 'Nexus development'
          git config user.email 'nexus-dev@local.invalid'
          if [[ ! -f evidence/gate5a-relational-dev-001.json ]]; then
            dest=gate5a-relational-dev-001.json
            python benchmarks/gate5a_dev.py "results/$dest"
          elif [[ -f docs/GATE5B_PREREG.md && ! -f evidence/gate5b-kv-patching-dev-001.json ]]; then
            dest=gate5b-kv-patching-dev-001.json
            python benchmarks/gate5b_dev.py "results/$dest"
          else
            exit 0
          fi
          cp "results/$dest" "evidence/$dest"
          git add "evidence/$dest"
          git commit -m "Record measured $dest"
          if [[ "$dest" == gate5b* ]]; then
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
            python -m pytest -q | tee results/tests.txt
            python benchmarks/prefix_causality_dev.py | tee results/prefix.txt
            python -c "import json; p=json.load(open('evidence/gate5b-kv-patching-dev-001.json'))['kv_parity']; print({k:v for k,v in p.items() if k!='fails'}, 'failed cases',len(p['fails'])); assert not p['fails']"
            git fsck --full --strict
            git diff --check cb8ff42..HEAD
            git diff --check
            test -z "$(git status --porcelain)"
          fi
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
