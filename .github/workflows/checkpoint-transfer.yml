name: Checkpoint transfer screen and confirmation
on:
  push:
    branches: [dev/checkpoint-transfer-fidelity]
    paths:
      - nexus_expanse/checkpoint_transport.py
      - benchmarks/checkpoint_transfer_study.py
      - benchmarks/checkpoint_transfer_report.py
      - docs/CHECKPOINT_TRANSFER_PROTOCOL.md
      - tests/test_checkpoint_transport.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: checkpoint-transfer-fidelity
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest
      - name: Execute locked stages and publish each completed receipt
        run: |
          set -euo pipefail
          mkdir -p results
          git config user.name 'Nexus development'
          git config user.email 'nexus-dev@local.invalid'
          python -m pytest -q tests/test_checkpoint_transport.py
          for stage in screen confirm escalate; do
            file="checkpoint-transfer-$stage.json"
            if test -s "evidence/$file"; then continue; fi
            if [[ "$stage" == escalate ]] && python -c "import json,sys; sys.exit(not json.load(open('evidence/checkpoint-transfer-confirm.json'))['all_pass'])"; then break; fi
            test -z "$(git status --porcelain)"
            python benchmarks/checkpoint_transfer_study.py "$stage" "results/$file"
            cp "results/$file" evidence/
            python benchmarks/checkpoint_transfer_report.py
            git add "evidence/$file" docs/CHECKPOINT_TRANSFER_HANDOFF.md
            git commit -m "Record checkpoint transfer $stage and refresh handoff"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          done
          python -m pytest -q | tee results/tests.txt
          python benchmarks/prefix_causality_dev.py | tee results/prefix.txt
          git fsck --full --strict
          git diff --check d48b2df..HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-study
          path: results/
