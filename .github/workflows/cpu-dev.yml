name: CPU development qualification
on:
  push:
    branches: [dev/causal-prefix-bb21fbe]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest
      - name: Execute committed development protocol
        run: |
          mkdir -p results
          if test -f benchmarks/run_qualification.sh; then
            bash benchmarks/run_qualification.sh
          else
            python benchmarks/prefix_causality_dev.py > results/baseline.json || test "$?" = 1
            python -c "import json; print(json.load(open('results/baseline.json')))"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-evidence
          path: results/
