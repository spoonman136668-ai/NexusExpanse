name: Multi-byte checkpoint interface challenge
on:
  push:
    branches: [dev/checkpoint-transfer-fidelity]
    paths:
      - docs/CHECKPOINT_BPE_PREREG.md
      - benchmarks/checkpoint_bpe_challenge.py
      - .github/workflows/checkpoint-transfer-bpe.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: checkpoint-transfer-bpe
  cancel-in-progress: false
jobs:
  challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest
      - run: |
          set -euo pipefail
          mkdir -p results
          git config user.name 'Nexus development'
          git config user.email 'nexus-dev@local.invalid'
          for stage in bpe-screen bpe-confirm; do
            file="checkpoint-transfer-$stage.json"
            if test -s "evidence/$file"; then continue; fi
            test -z "$(git status --porcelain)"
            python benchmarks/checkpoint_bpe_challenge.py "$stage" "results/$file"
            cp "results/$file" evidence/
            python benchmarks/checkpoint_bpe_report.py
            git add "evidence/$file" docs/CHECKPOINT_TRANSFER_HANDOFF.md
            git commit -m "Record $stage results and checkpoint transfer handoff"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          done
          name=checkpoint-transfer-components.json
          if ! test -s "evidence/$name"; then
            python benchmarks/checkpoint_component_map.py "results/$name"
            cp "results/$name" evidence/
            python benchmarks/checkpoint_bpe_report.py
            git add "evidence/$name" docs/CHECKPOINT_TRANSFER_HANDOFF.md
            git commit -m "Map donor tensor groups on fresh incompatible skills"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          python -m pytest -q | tee results/tests.txt
          python benchmarks/prefix_causality_dev.py | tee results/prefix.txt
          git diff --check d48b2df..HEAD
          git fsck --full --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-bpe-study
          path: results/
